name: Crawl giá vé KL

# ĐÃ TẮT tự chạy (lịch hằng ngày + chạy khi push). Muốn bật lại: bỏ dấu # ở các dòng dưới.
on:
  # schedule:
  #   - cron: "0 0 * * *"   # 00:00 UTC = 7:00 sáng giờ Việt Nam (GitHub có thể chạy trễ 5-30 phút)
  workflow_dispatch:       # chỉ còn nút "Run workflow" để chạy tay
  # push:                  # sửa code crawl rồi Push từ GitHub Desktop là chạy thử luôn
  #   branches: [main]
  #   paths:
  #     - crawler.py
  #     - update_prices.py
  #     - requirements.txt
  #     - .github/workflows/crawl.yml

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Cài + crawl, toàn bộ log ghi vào data/last-run.log rồi commit lên repo,
      # để xem được lỗi bằng GitHub Desktop (Pull) mà không cần vào web.
      - name: Cài thư viện + crawl giá
        id: crawl
        continue-on-error: true
        run: |
          set -o pipefail
          {
            echo "Bắt đầu: $(TZ=Asia/Ho_Chi_Minh date '+%F %T') (commit ${GITHUB_SHA::7})"
            pip install -q -r requirements.txt
            python -m playwright install --with-deps chromium > /tmp/pw-install.log 2>&1 || { tail -n 40 /tmp/pw-install.log; exit 1; }
            python update_prices.py
          } 2>&1 | tee data/last-run.log

      - name: Lưu dữ liệu + log vào repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          echo "Kết quả: ${{ steps.crawl.outcome }}" >> data/last-run.log
          git add -A data
          if git diff --cached --quiet; then
            echo "Không có gì thay đổi"
          else
            git commit -m "Giá ngày $(TZ=Asia/Ho_Chi_Minh date +%F) (${{ steps.crawl.outcome }})"
            # Nếu trong lúc crawl bạn vừa push code mới thì lấy về trước rồi mới đẩy lên
            git pull --rebase
            git push
          fi

      - name: Báo lỗi nếu crawl hỏng (để GitHub gửi email)
        if: steps.crawl.outcome == 'failure'
        run: |
          echo "Crawl lỗi, xem data/last-run.log"
          exit 1
