name: Crawl giá vé KL

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = 7:00 sáng giờ Việt Nam (GitHub có thể chạy trễ 5-30 phút)
  workflow_dispatch:       # nút "Run workflow" để chạy tay

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cài thư viện + Chromium
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Crawl giá
        run: python update_prices.py

      - name: Lưu dữ liệu vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "Không có gì thay đổi"
          else
            git commit -m "Giá ngày $(TZ=Asia/Ho_Chi_Minh date +%F)"
            git push
          fi
